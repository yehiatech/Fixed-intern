
services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_callcenter}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword}
    ports:
      - "5433:5432"
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-ai_callcenter}"]
      interval: 10s
      timeout: 5s
      retries: 5



  call-orchestrator:
    build: ./call-orchestrator
    container_name: call-orchestrator
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      - DB_HOST=db
    ports:
      - "8001:8001"
    volumes:
      - ./call-orchestrator:/app
    depends_on:
      db:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s



  rag-chatbot:
    build: ./rag-chatbot
    container_name: rag-chatbot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      - DB_HOST=db
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_started

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    user: "473:473"
    group_add:
      - "998"
    env_file:
      - ./monitoring/alloy/alloy.env
    command:
      - run
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/snap/docker/common/var-lib-docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/var/lib/alloy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf "GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          IFS= read -r status <&3 &&
          [[ "$$status" == *"200 OK"* ]]'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s





  chat-widget:
    image: nginx:alpine
    container_name: chat-widget
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./chat-widget:/usr/share/nginx/html:ro

volumes:
  prod_pgdata:

  alloy_data:
