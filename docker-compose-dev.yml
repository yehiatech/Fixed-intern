
services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_callcenter}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword}
    ports:
      - "5432:5432"
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-ai_callcenter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  espocrm:
    image: espocrm/espocrm:8.3
    container_name: espocrm
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ESPOCRM_DATABASE_PLATFORM: Postgresql
      ESPOCRM_DATABASE_HOST: db
      ESPOCRM_DATABASE_USER: ${DB_USER:-admin}
      ESPOCRM_DATABASE_PASSWORD: ${DB_PASSWORD:-supersecretpassword}
      ESPOCRM_DATABASE_NAME: espocrm
      ESPOCRM_SITE_URL: "http://localhost:8080"
    ports:
      - "8080:80"
    volumes:
      - espocrm_data:/var/www/html
    depends_on:
      db:
        condition: service_started

  espocrm-daemon:
    image: espocrm/espocrm:8.3
    container_name: espocrm-daemon
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - espocrm_data:/var/www/html
    entrypoint: docker-daemon.sh
    depends_on:
      - espocrm

  call-orchestrator:
    build: ./call-orchestrator
    container_name: call-orchestrator
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./call-orchestrator:/app
    depends_on:
      db:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  livekit-agent:
    build: ./call-orchestrator
    container_name: livekit-agent
    command: python livekit_agent.py start
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    volumes:
      - ./call-orchestrator:/app
    depends_on:
      livekit:
        condition: service_started
      call-orchestrator:
        condition: service_started

  rag-chatbot:
    build: ./rag-chatbot
    container_name: rag-chatbot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_started

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    user: "473:473"
    group_add:
      - "998"
    env_file:
      - ./monitoring/alloy/alloy.env
    command:
      - run
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/snap/docker/common/var-lib-docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/var/lib/alloy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf "GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          IFS= read -r status <&3 &&
          [[ "$$status" == *"200 OK"* ]]'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bridge-scripts:
    build: ./scripts
    container_name: bridge-scripts
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      ESPO_API_URL: "http://espocrm:80/api/v1"
      ORCHESTRATOR_URL: "http://call-orchestrator:8001/calls"
    volumes:
      - ./scripts:/app
    depends_on:
      espocrm:
        condition: service_started
      call-orchestrator:
        condition: service_started
    healthcheck:
      test: ["CMD", "pidof", "crond"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    command: --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - LIVEKIT_KEYS=devkey:secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prod_pgdata:
  espocrm_data:
  alloy_data:
