<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="common.js"></script>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background-color: #f5f6f8; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="antialiased flex flex-col h-screen overflow-hidden">
    
    <!-- Top Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-200 z-10 flex-shrink-0">
        <div class="px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <span id="orgNameLabel" class="text-xl font-bold text-[#177a94]">Workspace</span>
                    <span class="ml-4 px-2 py-1 bg-blue-50 text-xs font-semibold text-blue-700 rounded border border-blue-200">Agent</span>
                </div>
                <div class="flex items-center space-x-6">
                    
                    <a href="login.html" class="text-sm text-gray-400 hover:text-red-600 transition-colors">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Workspace Area -->
    <main class="flex-1 overflow-hidden p-4 sm:p-6 flex flex-col lg:flex-row gap-6 max-w-[1600px] mx-auto w-full">
        
        <!-- LEFT COLUMN: Ticket Management -->
        <div class="flex-1 flex flex-col min-w-0 bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
            
            <!-- Header -->
            <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-white flex-shrink-0">
                <div>
                    <h2 class="text-lg font-bold text-gray-900">My Assigned Tickets</h2>
                </div>
                
            </div>
            
            <!-- Ticket Table -->
            <div class="flex-1 overflow-y-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ticket Details</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Customer</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ticketTableBody" class="bg-white divide-y divide-gray-200">
                      </tbody>
                </table>
            </div>
        </div>

        <!-- RIGHT COLUMN: Embedded Actual Chatbot -->
        <div id="rag-chatbot-container" class="w-full lg:w-[400px] flex flex-col bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden flex-shrink-0 h-[600px] lg:h-auto">
            <!-- Injected by chatbot_component.js -->
        </div>
    </main>

    <!-- Create Ticket Modal -->
    <div id="ticketModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50 flex items-center justify-center">
        <div class="relative p-6 border w-[500px] shadow-xl rounded-xl bg-white">
            <h3 class="text-xl font-bold text-gray-900 mb-1">Open New Ticket</h3>
            <p class="text-sm text-gray-500 mb-5">Create a support ticket manually.</p>
            
            <form id="ticketForm">
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Customer Name</label>
                    <input type="text" id="tCustomer" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#177a94]" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Subject</label>
                    <input type="text" id="tSubject" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#177a94]" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Assign Initial Agent</label>
                    <select id="tAgent" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#177a94]">
                        <option value="">-- Leave Unassigned --</option>
                        <option value="agent1">Agent: John Smith</option>
                        <option value="agent2">Agent: Emma Davis</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" id="closeTicketModal" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium text-sm">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-[#177a94] text-white rounded-lg hover:bg-[#126379] font-medium text-sm shadow-sm">Create Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Session / organization ---
            const SESSION = requireSession();
            if (!SESSION) return;
            document.getElementById('orgNameLabel').textContent = (SESSION.organization_name || 'Organization') + ' Workspace';
            const ORG_API = `/api/organizations/${SESSION.organization_id}`;

            // --- Ticket Logic: only tickets assigned to THIS agent, read from the database ---
            const ticketTableBody = document.getElementById('ticketTableBody');

            function transcriptHtml(list) {
                if (!list || !list.length) {
                    return '<div class="text-xs text-gray-400 italic">No chat history for this ticket.</div>';
                }
                return list.map(m => m.role === 'user'
                    ? `<div class="flex flex-col items-end"><div class="bg-blue-100 text-blue-900 px-3 py-1.5 rounded-l-lg rounded-tr-lg inline-block">${esc(m.text)}</div></div>`
                    : `<div class="flex flex-col items-start"><div class="bg-gray-200 text-gray-800 px-3 py-1.5 rounded-r-lg rounded-tl-lg inline-block">${esc(m.text)}</div></div>`
                ).join('');
            }

            function ticketRowsHtml(t) {
                const id = esc(t.id);
                const phone = t.phone_number ? `<br><span class="text-xs text-gray-400">${esc(t.phone_number)}</span>` : '';
                return `
                        <tr id="row-${id}" data-ticket-id="${id}" class="hover:bg-blue-50 cursor-pointer transition-colors" onclick="toggleTicketDetails('${id}', '${esc(t.customer_name)}', '${esc(t.phone_number || '')}', false)">
                            <td class="px-6 py-4">
                                <div class="text-sm font-bold text-[#177a94]">${esc(formatTicketId(t.id))}</div>
                                <div class="text-sm text-gray-900 mt-1">${esc(t.issue_description)}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${esc(t.customer_name)}${phone}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">
                                <select id="status-${id}" data-prev="${esc(t.status)}" class="status-select text-xs font-semibold rounded-full px-3 py-1 border focus:outline-none focus:ring-1 appearance-none cursor-pointer text-center ${STATUS_CLASSES[t.status] || STATUS_CLASSES.open}" onclick="event.stopPropagation()">
                                    ${statusOptionsHtml(t.status)}
                                </select>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">
                                <button class="inline-flex items-center justify-center gap-2 px-4 py-1.5 bg-green-500 hover:bg-green-600 text-white text-sm font-medium rounded-lg transition-colors shadow-sm" onclick="event.stopPropagation(); toggleTicketDetails('${id}', '${esc(t.customer_name)}', '${esc(t.phone_number || '')}', true)">
                                    Call
                                </button>
                            </td>
                        </tr>
                        <tr id="details-${id}" class="hidden bg-gray-50 border-b-2 border-[#177a94]">
                            <td colspan="4" class="px-6 py-6">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                        <h3 class="text-sm font-bold text-gray-800 mb-4">AI Chat Handoff Context</h3>
                                        <div class="space-y-3 text-sm text-gray-700 bg-gray-50 p-3 rounded-lg border border-gray-100 h-[150px] overflow-y-auto">
                                            ${transcriptHtml(t.ai_transcript)}
                                        </div>
                                    </div>
                                    <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col">
                                        <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center justify-between">
                                            <div class="flex items-center gap-2">Call Transcript</div>
                                            <span class="text-[10px] font-bold bg-purple-100 text-purple-700 px-2 py-0.5 rounded border border-purple-200">Powered by Vonage</span>
                                        </h3>
                                        <div id="transcript-${id}" class="space-y-2 text-sm text-gray-700 bg-gray-50 p-3 rounded-lg border border-gray-100 h-[150px] overflow-y-auto mb-3">
                                            <div class="h-full flex items-center justify-center">
                                                <span class="text-xs text-gray-400 italic">Waiting for call to begin...</span>
                                            </div>
                                        </div>
                                        <div class="flex items-center justify-between mt-auto pt-2 border-t border-gray-100">
                                            <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                                                <input type="checkbox" id="resolved-${id}" class="w-4 h-4 text-[#177a94] rounded border-gray-300 focus:ring-[#177a94]">
                                                <span class="font-medium">Call resolved the issue</span>
                                            </label>
                                            <button onclick="saveCallLog('${id}')" class="bg-[#177a94] hover:bg-[#126379] text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-colors">
                                                Update Status
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>`;
            }

            async function loadMyTickets() {
                try {
                    const { tickets } = await apiFetch(`${ORG_API}/tickets?agent_id=${encodeURIComponent(SESSION.user_id)}`);
                    // keep expanded panels open across refreshes
                    const openIds = [...ticketTableBody.querySelectorAll('tr[id^="details-"]:not(.hidden)')].map(r => r.id);
                    ticketTableBody.innerHTML = tickets.length
                        ? tickets.map(ticketRowsHtml).join('')
                        : '<tr><td colspan="4" class="px-6 py-10 text-center text-sm text-gray-400">No tickets are assigned to you yet.</td></tr>';
                    openIds.forEach(id => { const r = document.getElementById(id); if (r) r.classList.remove('hidden'); });
                } catch (err) {
                    console.error('Failed to load tickets:', err);
                }
            }

            // Status changes are saved immediately; on failure the old value comes back.
            ticketTableBody.addEventListener('change', async (e) => {
                const el = e.target;
                if (!el.classList.contains('status-select')) return;
                const ticketId = el.closest('tr').dataset.ticketId;
                try {
                    await apiFetch(`${ORG_API}/tickets/${encodeURIComponent(ticketId)}/status`, { method: 'PUT', body: { status: el.value } });
                    el.className = el.className.replace(/(bg|text|border|focus:ring)-(red|yellow|green|gray)-\d+/g, '').trim() + ' ' + STATUS_CLASSES[el.value];
                    el.dataset.prev = el.value;
                } catch (err) {
                    alert(err.message);
                    el.value = el.dataset.prev;
                }
            });

            loadMyTickets();
            // Pick up newly assigned tickets (skip while the agent is typing / using a dropdown in the table).
            setInterval(() => {
                if (!ticketTableBody.contains(document.activeElement)) loadMyTickets();
            }, 15000);
        });
    </script>

    <!-- Ticket Expansion Logic -->
    <script>
        async function triggerAgentCall(ticketId, customerName, customerPhone) {
            const s = getSession();
            
            const transcriptDiv = document.getElementById('transcript-' + ticketId);
            if (transcriptDiv) {
                transcriptDiv.innerHTML = '<div class="h-full flex items-center justify-center"><span class="text-xs text-blue-500 font-semibold italic">Call initiated...</span></div>';
            }

            let phone = (customerPhone || "0127466913").trim();
            // Auto-format local Egyptian numbers
            if (phone.startsWith("01") && phone.length === 11) {
                phone = "+20" + phone.substring(1);
            } else if (phone.startsWith("201") && phone.length === 12) {
                phone = "+" + phone;
            } else if (!phone.startsWith("+")) {
                phone = "+" + phone;
            }

            try {
                const response = await fetch("http://localhost:8001/calls/trigger", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        call_id: ticketId,
                        customer_phone: phone,
                        customer_name: customerName,
                        org_id: s.organization_id,
                        retry_attempt: 0,
                        assigned_agent: s.user_id,
                        language: "ar-EG"
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    alert("Failed to start call: " + (err.message || err.detail || response.statusText));
                    if (transcriptDiv) {
                        transcriptDiv.innerHTML = '<div class="h-full flex items-center justify-center"><span class="text-xs text-red-500 font-semibold italic">Call failed</span></div>';
                    }
                } else {
                    if (transcriptDiv) {
                        transcriptDiv.innerHTML = '<div class="h-full flex items-center justify-center"><span class="text-xs text-green-500 font-semibold italic">Call in progress...</span></div>';
                    }
                }
            } catch (error) {
                console.error("Error triggering call:", error);
                alert("Error triggering call: " + error);
                if (transcriptDiv) {
                    transcriptDiv.innerHTML = '<div class="h-full flex items-center justify-center"><span class="text-xs text-red-500 font-semibold italic">Connection error</span></div>';
                }
            }
        }

        function toggleTicketDetails(ticketId, customerName, customerPhone, focusCall = false) {
            const detailsRow = document.getElementById('details-' + ticketId);
            detailsRow.classList.toggle('hidden');
            
            if (focusCall && !detailsRow.classList.contains('hidden')) {
                triggerAgentCall(ticketId, customerName, customerPhone);
            }
        }

        async function saveCallLog(ticketId) {
            const s = getSession();
            const isResolved = document.getElementById('resolved-' + ticketId).checked;
            const newStatus = isResolved ? 'resolved' : 'open';
            const statusDropdown = document.getElementById('status-' + ticketId);

            try {
                await apiFetch(`/api/organizations/${s.organization_id}/tickets/${encodeURIComponent(ticketId)}/status`,
                               { method: 'PUT', body: { status: newStatus } });
            } catch (err) {
                alert('Could not save: ' + err.message);
                return;
            }

            statusDropdown.value = newStatus;
            statusDropdown.dataset.prev = newStatus;
            alert(isResolved ? 'Log saved! Ticket marked as Resolved.' : 'Log saved! Issue is still active, ticket remains Open.');

            // Trigger color change logic manually
            statusDropdown.className = statusDropdown.className.replace(/(bg|text|border|focus:ring)-(red|yellow|green|gray)-\d+/g, '').trim() + ' ' + STATUS_CLASSES[newStatus];

            // Close the panel and reset the checkbox
            toggleTicketDetails(ticketId);
            document.getElementById('resolved-' + ticketId).checked = false;
        }
    </script>

    <script src="chatbot_component.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initChatbot === 'function') {
                initChatbot('rag-chatbot-container');
            }
        });
    </script>
</body>
</html>
